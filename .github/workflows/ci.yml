name: CI

on:
  pull_request:
  push:
    branches: [master]

# Cancel in-flight runs for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      # npm install (not ci) — vitest 4 and drizzle-kit pin different esbuild
      # peer ranges that npm 10's `ci` refuses to reconcile. npm install still
      # honours the lockfile for everything else. Revisit when npm 11+ is the
      # baseline on the runners.
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check

  build:
    name: Build (catches stale dist/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      # npm install (not ci) — vitest 4 and drizzle-kit pin different esbuild
      # peer ranges that npm 10's `ci` refuses to reconcile. npm install still
      # honours the lockfile for everything else. Revisit when npm 11+ is the
      # baseline on the runners.
      - run: npm install --no-audit --no-fund
      - run: npm run build

  test:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      # npm install (not ci) — vitest 4 and drizzle-kit pin different esbuild
      # peer ranges that npm 10's `ci` refuses to reconcile. npm install still
      # honours the lockfile for everything else. Revisit when npm 11+ is the
      # baseline on the runners.
      - run: npm install --no-audit --no-fund
      # Spin up the same Postgres + OpenFGA stack used for local dev so the
      # integration tests' isDbReachable() / isFgaReachable() return true.
      - name: Start Postgres + OpenFGA
        run: docker compose up -d --wait
      - name: Apply migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: postgres://miramira:miramira@localhost:5432/miramira
      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: postgres://miramira:miramira@localhost:5432/miramira
      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --no-color

  docker-build:
    name: Docker image builds
    # Build-only smoke test on PRs. master / tags publish via docker-publish.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: miramira:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-publish:
    name: Build + push image (GHCR)
    # Publish on pushes to master and on version tags. Skipped for PRs (which
    # may come from forks without package-write permission).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # master push -> :master + :sha-<short>; tag push -> :<semver> + :latest
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
