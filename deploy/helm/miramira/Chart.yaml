apiVersion: v2
name: miramira
description: Standalone relationship-based authorization service (Fastify + Drizzle + OpenFGA)
type: application
# Chart version — bump on chart changes.
version: 0.1.0
# Default image tag when image.tag is unset. Tracks the app release.
appVersion: "0.1.0"

dependencies:
  # OpenFGA runs in-cluster, backed by your managed Postgres (a separate
  # database). Pulled from the official chart repo. After editing this block
  # run: helm dependency update deploy/helm/miramira
  #
  # NOTE: verify the version against `helm search repo openfga/openfga` — the
  # value keys under `.Values.openfga` (datastore.*, migrate.*) can shift
  # between chart majors. Pin to whatever you've validated.
  - name: openfga
    version: "0.2.41"
    repository: https://openfga.github.io/helm-charts
    condition: openfga.enabled
