apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "miramira.configMapName" . }}
  labels:
    {{- include "miramira.labels" . | nindent 4 }}
data:
  # Keys match env var names — consumed via envFrom on api + worker.
  NODE_ENV: {{ .Values.config.nodeEnv | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  HOST: "0.0.0.0"
  PORT: {{ .Values.api.port | quote }}
  METRICS_PORT: {{ .Values.worker.metricsPort | quote }}
  SHUTDOWN_TIMEOUT_MS: {{ .Values.config.shutdownTimeoutMs | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.config.corsAllowedOrigins | quote }}
  OPENFGA_API_URL: {{ include "miramira.openfgaApiUrl" . | quote }}
  SUPABASE_JWKS_URL: {{ .Values.config.supabaseJwksUrl | quote }}
  SUPABASE_JWT_ISSUER: {{ .Values.config.supabaseJwtIssuer | quote }}
  SUPABASE_JWT_AUDIENCE: {{ .Values.config.supabaseJwtAudience | quote }}
