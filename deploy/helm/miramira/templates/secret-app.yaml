{{- if and .Values.appSecret.create (not .Values.appSecret.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "miramira.appSecretName" . }}
  labels:
    {{- include "miramira.labels" . | nindent 4 }}
  # Early pre-install/pre-upgrade hook (weight -10, before the -5 migrate Job)
  # so DATABASE_URL is available to the migrate hook, which runs before
  # main-phase resources. before-hook-creation keeps it for the runtime pods.
  # (The appSecret.existingSecret path is pre-created out of band, so it is
  # unaffected and already present at hook time.)
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  {{- if not .Values.appSecret.databaseUrl }}
  {{- fail "appSecret.databaseUrl is required (or set appSecret.existingSecret)" }}
  {{- end }}
  DATABASE_URL: {{ .Values.appSecret.databaseUrl | quote }}
  {{- with .Values.appSecret.supabaseWebhookSecret }}
  SUPABASE_WEBHOOK_SECRET: {{ . | quote }}
  {{- end }}
{{- end }}
