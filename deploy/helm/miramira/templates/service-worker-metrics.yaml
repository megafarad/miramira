apiVersion: v1
kind: Service
metadata:
  name: {{ include "miramira.fullname" . }}-worker-metrics
  labels:
    {{- include "miramira.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  type: ClusterIP
  # Headless — only used for in-cluster Prometheus scraping of each worker pod.
  clusterIP: None
  selector:
    {{- include "miramira.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: worker
  ports:
    - name: metrics
      port: {{ .Values.worker.metricsPort }}
      targetPort: metrics
