{{/*
  OpenFGA bootstrap. post-install/post-upgrade hook (weight 0, after the
  bootstrap RBAC at -5). Flow (all kubectl steps are shell-free so a distroless
  image like registry.k8s.io/kubectl works):
    1. initContainer `bootstrap` (app image — has a shell) waits for OpenFGA
       /healthz, runs the bootstrap (create/reuse store, write the current
       model), and writes a kubectl JSON merge-patch with the IDs to /shared.
    2. initContainer `patch-ids` (kubectl) applies that patch file to the IDs
       Secret — one command, no shell.
    3. main container `rollout-restart` (kubectl) rolls api/worker so they
       re-read the Secret (env is fixed at pod start) — one command, no shell.
  initContainers run in order before the main container, so the patch always
  lands before the restart. The store is reused across upgrades because
  OPENFGA_STORE_ID is fed in from the (lookup-preserved) IDs Secret.
*/}}
{{- $ids := include "miramira.openfgaIdsSecretName" . -}}
{{- $api := printf "%s-api" (include "miramira.fullname" .) -}}
{{- $worker := printf "%s-worker" (include "miramira.fullname" .) -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "miramira.fullname" . }}-openfga-bootstrap
  labels:
    {{- include "miramira.labels" . | nindent 4 }}
    app.kubernetes.io/component: openfga-bootstrap
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "miramira.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: openfga-bootstrap
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "miramira.fullname" . }}-bootstrap
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: bootstrap
          image: {{ include "miramira.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "miramira.configMapName" . }}
            # Supplies OPENFGA_STORE_ID for reuse (empty on first install).
            - secretRef:
                name: {{ $ids }}
          env:
            - name: BOOTSTRAP_OUTPUT_PATH
              value: /shared/fga.env
          command: ["sh", "-c"]
          args:
            - |
              set -e
              echo "Waiting for OpenFGA at $OPENFGA_API_URL ..."
              i=0
              until node -e "fetch(process.env.OPENFGA_API_URL + '/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; do
                i=$((i+1))
                if [ "$i" -ge 60 ]; then echo "OpenFGA not ready after ~3m; giving up"; exit 1; fi
                echo "  not ready, retry $i"; sleep 3
              done
              echo "OpenFGA ready; running bootstrap"
              node dist/openfga/bootstrap.js
              # Emit a kubectl merge-patch so the (shell-free) kubectl step can
              # apply it via --patch-file without any shell interpolation.
              . /shared/fga.env
              printf '{"stringData":{"OPENFGA_STORE_ID":"%s","OPENFGA_AUTHORIZATION_MODEL_ID":"%s"}}' \
                "$OPENFGA_STORE_ID" "$OPENFGA_AUTHORIZATION_MODEL_ID" > /shared/patch.json
              echo "Wrote patch file for {{ $ids }}"
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: shared
              mountPath: /shared
            - name: tmp
              mountPath: /tmp
        - name: patch-ids
          image: {{ .Values.bootstrap.kubectlImage }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            # kubectl caches discovery under $HOME; keep it on writable scratch.
            - name: HOME
              value: /tmp
          command: ["kubectl"]
          args:
            - patch
            - secret
            - {{ $ids }}
            - --namespace={{ .Release.Namespace }}
            - --type=merge
            - --patch-file=/shared/patch.json
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - name: shared
              mountPath: /shared
            - name: tmp
              mountPath: /tmp
      containers:
        - name: rollout-restart
          image: {{ .Values.bootstrap.kubectlImage }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: HOME
              value: /tmp
          command: ["kubectl"]
          args:
            - rollout
            - restart
            - deployment/{{ $api }}
            - deployment/{{ $worker }}
            - --namespace={{ .Release.Namespace }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: shared
          emptyDir: {}
        - name: tmp
          emptyDir: {}
