{{/*
  Holds OPENFGA_STORE_ID + OPENFGA_AUTHORIZATION_MODEL_ID, consumed by api +
  worker via envFrom. The bootstrap Job patches these in after creating the
  store/model. To stop `helm upgrade` from clobbering the Job's values, we seed
  from the already-applied Secret via `lookup` (falling back to values, then
  ""). `resource-policy: keep` leaves it in place on uninstall so the store/
  model survive a reinstall.
*/}}
{{- $name := include "miramira.openfgaIdsSecretName" . -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) -}}
{{- $storeId := .Values.openfgaIds.storeId -}}
{{- $modelId := .Values.openfgaIds.authorizationModelId -}}
{{- if $existing -}}
{{- $storeId = (index $existing.data "OPENFGA_STORE_ID" | default ($storeId | b64enc) | b64dec) -}}
{{- $modelId = (index $existing.data "OPENFGA_AUTHORIZATION_MODEL_ID" | default ($modelId | b64enc) | b64dec) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "miramira.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  OPENFGA_STORE_ID: {{ $storeId | quote }}
  OPENFGA_AUTHORIZATION_MODEL_ID: {{ $modelId | quote }}
