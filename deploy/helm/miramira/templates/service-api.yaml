apiVersion: v1
kind: Service
metadata:
  name: {{ include "miramira.fullname" . }}-api
  labels:
    {{- include "miramira.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    {{- include "miramira.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    # /metrics is served on this same port — keep ingress scoped to API paths,
    # don't route /metrics publicly.
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
