{{/*
  DB migration Job. pre-install/pre-upgrade hook so the schema is current
  before new api/worker pods roll. Runs the drizzle-orm migrator baked into the
  image (no devDependencies needed). Independent of OpenFGA.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "miramira.fullname" . }}-migrate
  labels:
    {{- include "miramira.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "miramira.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      # Pre-install hook: runs before the app ServiceAccount (a main-phase
      # resource) exists, so it can't pin that SA. Migrations only talk to
      # Postgres — no Kubernetes API access — so the namespace default SA is
      # sufficient and its token is not mounted.
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "miramira.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "dist/db/migrate.js"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "miramira.appSecretName" . }}
                  key: DATABASE_URL
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
