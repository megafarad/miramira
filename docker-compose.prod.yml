# Production-shape overlay. Adds the miramira service itself on top of the
# postgres + openfga stack from docker-compose.yml.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This is a starting point, not a production blueprint — a real deployment
# would replace the inlined POSTGRES_PASSWORD with a secret, expose miramira
# behind a TLS-terminating proxy, and run db:migrate:apply as a one-shot
# (manual or via a CI job) rather than coupling it to startup.

services:
  miramira:
    build:
      context: .
      dockerfile: Dockerfile
    image: miramira:local
    container_name: miramira-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      DATABASE_URL: postgres://miramira:miramira@postgres:5432/miramira
      OPENFGA_API_URL: http://openfga:8080
      # OPENFGA_STORE_ID and OPENFGA_AUTHORIZATION_MODEL_ID are produced by
      # `npm run openfga:bootstrap` against the openfga service. Set them in
      # an .env file or override on the command line for the first boot.
      OPENFGA_STORE_ID: ${OPENFGA_STORE_ID:?run npm run openfga:bootstrap and export OPENFGA_STORE_ID}
      OPENFGA_AUTHORIZATION_MODEL_ID: ${OPENFGA_AUTHORIZATION_MODEL_ID:?run npm run openfga:bootstrap and export OPENFGA_AUTHORIZATION_MODEL_ID}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL:?set SUPABASE_JWKS_URL}
      SUPABASE_JWT_ISSUER: ${SUPABASE_JWT_ISSUER:?set SUPABASE_JWT_ISSUER}
      SUPABASE_JWT_AUDIENCE: ${SUPABASE_JWT_AUDIENCE:-authenticated}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      # API + Prometheus /metrics share the main port.
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      openfga:
        condition: service_healthy

  worker:
    # Same image as the API; entrypoint is the outbox processor.
    build:
      context: .
      dockerfile: Dockerfile
    image: miramira:local
    container_name: miramira-worker
    restart: unless-stopped
    command: ['node', 'dist/workers/index.js']
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      METRICS_PORT: 9090
      DATABASE_URL: postgres://miramira:miramira@postgres:5432/miramira
      OPENFGA_API_URL: http://openfga:8080
      OPENFGA_STORE_ID: ${OPENFGA_STORE_ID:?run npm run openfga:bootstrap and export OPENFGA_STORE_ID}
      OPENFGA_AUTHORIZATION_MODEL_ID: ${OPENFGA_AUTHORIZATION_MODEL_ID:?run npm run openfga:bootstrap and export OPENFGA_AUTHORIZATION_MODEL_ID}
      # Worker doesn't validate JWTs or honor CORS, but env schema requires
      # these fields. Reuse the API's values to keep the env profile uniform.
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL:?set SUPABASE_JWKS_URL}
      SUPABASE_JWT_ISSUER: ${SUPABASE_JWT_ISSUER:?set SUPABASE_JWT_ISSUER}
      SUPABASE_JWT_AUDIENCE: ${SUPABASE_JWT_AUDIENCE:-authenticated}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '9090:9090'
    depends_on:
      postgres:
        condition: service_healthy
      openfga:
        condition: service_healthy
